# =============================================================================
# Configuration mediamtx pour streaming Field -> PC org -> VMS Qonify
# =============================================================================
# NE PAS copier ce fichier a la main : scripts/deploy_mediamtx.ps1 le copie
# dans E:\TITAN\production\mediamtx en y injectant la cle __MEDIAMTX_AUTH_KEY__ (variable
# machine MEDIAMTX_AUTH_HMAC_KEY, la meme que celle lue par Cockpit), verifie
# la config puis redemarre le service.
#
# Architecture pool de slots fixes :
#   - 3 paths declares statiquement : field-1, field-2, field-3
#   - Cockpit alloue dynamiquement un slot par demande de flux
#   - Qonify est configure UNE FOIS avec les 3 URLs RTSP stables
#   - Chaque publication / lecture est autorisee par Cockpit (authMethod http)
#
# RGPD :
#   - record: no sur tous les paths (pas d'enregistrement serveur)
#   - audio coupe cote tablette via getUserMedia({audio: false})
# =============================================================================

logLevel: info
logDestinations: [stdout]

# -----------------------------------------------------------------------------
# Authentification : mediamtx demande a Cockpit avant CHAQUE publication ou
# lecture. Appel direct a Waitress en local (pas via IIS ni le nom public :
# le serveur ne sait pas se joindre par son IP publique, pas de hairpin NAT).
# Cockpit exige l'appel depuis 127.0.0.1 ET la cle k.
# -----------------------------------------------------------------------------
authMethod: http
authHTTPAddress: http://127.0.0.1:4008/field/api/stream/auth?k=__MEDIAMTX_AUTH_KEY__
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# API locale (127.0.0.1 seulement) : Cockpit y lit l'etat reel des paths
# (tablette encore connectee ?) et coupe un flux arrete depuis le PC org.
api: yes
apiAddress: 127.0.0.1:9997
metrics: no
pprof: no
playback: no

# -----------------------------------------------------------------------------
# RTSP : sortie consommee par Qonify (port 8554/TCP)
# TCP seul : un VMS qui tente l'UDP est refuse proprement et rebascule en TCP
# (un seul port a ouvrir, pas de flux RTP UDP bloque en silence).
# -----------------------------------------------------------------------------
rtsp: yes
rtspAddress: :8554
protocols: [tcp]
encryption: "no"

# -----------------------------------------------------------------------------
# WebRTC : ingest WHIP depuis la tablette, lecture WHEP depuis le PC org.
# Signalisation HTTP sur 127.0.0.1:8889 uniquement : exposee par IIS sous
# https://cockpit.lemans.org/webrtc/ (regle ReverseProxyToMediamtxWebRTC).
# Media en UDP 8189 direct entre la tablette / le PC org et ce serveur.
# -----------------------------------------------------------------------------
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no  # TLS termine par IIS
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
# Les IP des interfaces (VLAN24 10.24.0.251, DMZ 192.168.254.35) sont
# annoncees automatiquement. On ajoute l'IP publique (NAT 8189/UDP vers ce
# serveur) pour les tablettes en 4G.
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts:
  - 89.127.253.6

# Protocoles inutilises : fermes
rtmp: no
hls: no
srt: no

# -----------------------------------------------------------------------------
# Defauts appliques a tous les paths
# -----------------------------------------------------------------------------
pathDefaults:
  source: publisher
  maxReaders: 10                 # PC org + Qonify + marge
  record: no                     # RGPD : jamais d'enregistrement
  overridePublisher: yes         # un nouveau flux remplace l'ancien sur le slot

# -----------------------------------------------------------------------------
# 3 slots fixes. Les view_token (stables, en base field_stream_slots) sont
# connus de Qonify ; les publish_token (jetables) sont remis a la tablette
# par Cockpit a chaque acceptation.
# -----------------------------------------------------------------------------
paths:
  field-1:
  field-2:
  field-3:
  # Flux "PC org uniquement" : un path prive par flux (live-<stream_id>),
  # jamais declare dans le VMS. Cockpit y refuse toute lecture RTSP.
  '~^live-[0-9a-f]{24}$':
