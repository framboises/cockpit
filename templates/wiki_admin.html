<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>COCKPIT — Wiki (administration)</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/wiki.css') }}">
</head>

<body>
<div class="app-layout">

  <!-- Sidebar -->
  {% set sidebar_active = '/admin/wiki' %}
  {% include '_sidebar.html' %}

  <!-- Main -->
  <div class="app-main single-col-page">
    <header class="app-header">
      <span class="header-title" style="display:flex; align-items:center; gap:8px;">
        <span class="material-symbols-outlined" style="font-size:22px;">edit_note</span>
        Wiki — administration
      </span>
      <div class="header-spacer"></div>
      <a href="/wiki" class="wk-btn" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;">
        <span class="material-symbols-outlined" style="font-size:18px;">visibility</span> Voir le wiki
      </a>
    </header>

    <div id="main-content">
      <div class="wk-adm">

        <!-- Colonne gauche : liste des fiches -->
        <div class="wk-adm-side">
          <div class="wk-adm-actions">
            <button id="wk-new-btn" class="wk-btn wk-primary">
              <span class="material-symbols-outlined" style="font-size:18px;">add</span> Nouvelle fiche
            </button>
            <button id="wk-cats-btn" class="wk-btn">
              <span class="material-symbols-outlined" style="font-size:18px;">category</span> Catégories
            </button>
          </div>
          <div class="wk-search wk-adm-search">
            <span class="material-symbols-outlined">search</span>
            <input id="wk-adm-search" type="search" placeholder="Rechercher une fiche…" autocomplete="off">
          </div>
          <div id="wk-adm-list" class="wk-adm-list"></div>
        </div>

        <!-- Colonne droite : éditeur -->
        <div id="wk-editor" class="wk-adm-main"></div>

      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
<script src="{{ url_for('static', filename='js/wiki.js') }}"></script>
<script src="{{ url_for('static', filename='js/wiki_admin.js') }}"></script>
<script>
  window.__userIsAdmin   = {{ "true" if "admin" in user_roles else "false" }};
  window.__userIsManager = {{ "true" if ("manager" in user_roles or "admin" in user_roles) else "false" }};
</script>
<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
<script src="{{ url_for('static', filename='js/ai_assistant.js') }}"></script>
</body>
</html>
